<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Portfolio</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Kreon:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html, body {
      width: 100%;
      overflow-x: hidden;
    }

    /* ─── BACKGROUND IMAGE LAYER ─────────────────────────────── */
    /* The image stretches to full width, height is natural (scrollable) */
    #bg-image {
      display: block;
      width: 100%;
      height: auto;
      position: relative;
      z-index: 0;
    }

    /* ─── OVERLAY LAYER ──────────────────────────────────────── */
    /* Sits on top of the image, same dimensions, absolutely positioned */
    #overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      /* height is set by JS to match image height */
      z-index: 1;
      pointer-events: none; /* lets clicks pass through to nothing by default */
    }

    /* Wrapper so overlay + image scroll together */
    #page {
      position: relative;
      width: 100%;
    }
    /* ─── GOOGLE PLAY LINK ───────────────────────────────── */

    .play-link {
      position: absolute;
      top: 99%;
      left: 50%;
      transform: translateX(-50%);

      display: flex;
      align-items: center;
      gap: 12px;

      font-family: 'Kreon', serif;
      font-size: 24px;
      font-weight: 500;

      color: white;
      text-decoration: none;

      pointer-events: all;
      white-space: nowrap;
    }

    .play-link:hover {
      opacity: 0.8;
    }

    .play-link img {
      width: 32px;
      height: 32px;
      object-fit: contain;
    }
    
    /* ─── EMBED BLOCKS ───────────────────────────────────────── */
    .embed-block {
      position: absolute;
      pointer-events: all;
    }

    /* itch.io iframe */
    .itchio-embed iframe,
    .itchio-embed {
      border: none;
      display: block;
    }

    /* video embed (YouTube / local) */
    .video-embed iframe,
    .video-embed video {
      border: none;
      display: block;
      width: 100%;
      height: 100%;
    }

    .video-embed {
      overflow: hidden;
    }

    
    #edit-hint strong { color: #f0c040; }
  </style>
</head>
<body>

<div id="page">

  <!-- ① BACKGROUND IMAGE — replace src with your Figma export -->
  <img id="bg-image"
       src="Frame 1.png"
       alt="Portfolio Background" />

  <!-- ② OVERLAY — embeds go inside here, positioned by % from top -->
  <div id="overlay">

    <a
      class="play-link"
      href="https://play.google.com/store/apps/details?id=com.alcheringa.jestercaster&hl=en_IN"
      target="_blank"
      rel="noopener noreferrer"
    >
      JESTER CASTER / ALCHERINGA 2026
      <img src="icon.png" alt="Google Play">
    </a>


    <!-- ══════════════════════════════════════════════
         LOCAL VIDEO EMBED  (uncomment to use)
    ═══════════════════════════════════════════════ -->
    <!--
    <div class="embed-block video-embed" style="
      top: 75%;
      left: 25%;
      width: 50%;
      aspect-ratio: 16/9;
    ">
      <video controls>
        <source src="your-video.mp4" type="video/mp4" />
      </video>
    </div>
    -->

  </div><!-- /overlay -->
</div><!-- /page -->





<script>
  // Makes overlay height always match image height (handles resizing too)
  const img = document.getElementById('bg-image');
  const overlay = document.getElementById('overlay');

  function syncHeight() {
    overlay.style.height = img.offsetHeight + 'px';
  }

  img.addEventListener('load', syncHeight);
  window.addEventListener('resize', syncHeight);

  // In case image is already cached
  if (img.complete) syncHeight();
</script>

</body>
</html>
